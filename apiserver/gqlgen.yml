schema:
  - ../graphql/schema.graphqls

exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

models:
  DateTime:
    model:
      - github.com/walnuts1018/beast/apiserver/graph/scalar.DateTime
  Base64:
    model:
      - github.com/walnuts1018/beast/apiserver/graph/scalar.Base64
