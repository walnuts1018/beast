name: Check

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint (${{ matrix.module.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - name: apiserver
            dir: apiserver
            go_mod: apiserver/go.mod
          - name: encoder
            dir: encoder
            go_mod: encoder/go.mod
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module.go_mod }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          working-directory: ${{ matrix.module.dir }}

  go-generate-diff:
    name: go generate 差分確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: apiserver/go.mod
      - name: go generate
        working-directory: apiserver
        run: go generate ./...
      - name: 差分確認
        run: git --no-pager diff --exit-code

  go-test:
    name: go test (${{ matrix.module.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - name: apiserver
            dir: apiserver
            go_mod: apiserver/go.mod
          - name: encoder
            dir: encoder
            go_mod: encoder/go.mod
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module.go_mod }}
      - name: go test
        working-directory: ${{ matrix.module.dir }}
        run: go test ./...
