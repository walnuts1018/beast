apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: beast-apiserver
  name: beast-apiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beast-apiserver
  template:
    metadata:
      labels:
        app: beast-apiserver
    spec:
      containers:
      - name: apiserver
        image: ghcr.io/walnuts1018/beast/apiserver:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_HOST
          value: postgresql-rw.postgres.svc.cluster.local
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: beast
        - name: POSTGRES_PASSWORD
          value: password
        - name: POSTGRES_DB
          value: beast
        - name: POSTGRES_SSLMODE
          value: disable
        - name: S3_REGION
          value: us-east-1
        - name: S3_ENDPOINT
          value: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
        - name: S3_BUCKET
          value: beast-upload-temp
        - name: S3_ACCESS_KEY_ID
          value: seaweedfs
        - name: S3_SECRET_ACCESS_KEY
          value: seaweedfs
        - name: S3_USE_PATH_STYLE
          value: "true"
        - name: UPLOAD_URL_TTL
          value: 15m
        - name: RABBITMQ_URL
          value: amqp://guest:guest@rabbitmq.rabbitmq.svc.cluster.local:5672/
        - name: RABBITMQ_ENCODE_JOB_QUEUE
          value: beast.encoder.jobs
        - name: RABBITMQ_ENCODE_EVENT_QUEUE
          value: beast.encoder.events
        - name: AUTH_MODE
          value: introspection
        - name: OIDC_INTROSPECTION_URL
          value: http://authelia.authelia.svc.cluster.local:9091/api/oidc/introspection
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: apiserver-oidc
              key: client-id
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: apiserver-oidc
              key: client-secret
        livenessProbe:
          httpGet:
            path: /livez
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        startupProbe:
          httpGet:
            path: /livez
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - all
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsGroup: 65532
        runAsUser: 65532
      volumes:
      - emptyDir: {}
        name: tmp
