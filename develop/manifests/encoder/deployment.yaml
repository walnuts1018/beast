apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: beast-encoder
  name: beast-encoder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beast-encoder
  template:
    metadata:
      labels:
        app: beast-encoder
    spec:
      containers:
      - name: encoder
        image: ghcr.io/walnuts1018/beast/encoder:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: RABBITMQ_URL
          value: amqp://guest:guest@rabbitmq.rabbitmq.svc.cluster.local:5672/
        - name: RABBITMQ_ENCODE_JOB_QUEUE
          value: beast.encoder.jobs
        - name: RABBITMQ_ENCODE_EVENT_QUEUE
          value: beast.encoder.events
        - name: S3_REGION
          value: us-east-1
        - name: AWS_REGION
          value: us-east-1
        - name: S3_ENDPOINT
          value: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
        - name: S3_BUCKET
          value: beast-upload-temp
        - name: S3_ACCESS_KEY_ID
          value: seaweedfs
        - name: AWS_ACCESS_KEY_ID
          value: seaweedfs
        - name: S3_SECRET_ACCESS_KEY
          value: seaweedfs
        - name: AWS_SECRET_ACCESS_KEY
          value: seaweedfs
        - name: S3_USE_PATH_STYLE
          value: "true"
        - name: ENCODER_POLL_INTERVAL
          value: 5s
        - name: ENCODER_WORK_DIR
          value: /tmp/beast-encoder
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 2
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - all
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsGroup: 65532
        runAsUser: 65532
      volumes:
      - emptyDir: {}
        name: tmp
