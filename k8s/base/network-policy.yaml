apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: beast-default-deny
  namespace: beast
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: beast-dns-egress
  namespace: beast
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: beast-api-ingress
  namespace: beast
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: beast
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: beast-service-egress
  namespace: beast
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: beast-data
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgres
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rabbitmq
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seaweedfs
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 8333
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: beast-encoder-egress
  namespace: beast
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: encoder
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: beast-data
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgres
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rabbitmq
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seaweedfs
      ports:
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 8333
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: beast-frontend-ingress
  namespace: beast
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: beast
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: beast-frontend-egress
  namespace: beast
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: beast
      ports:
        - protocol: TCP
          port: 8080
