apiVersion: apps/v1
kind: Deployment
metadata:
  name: beast-apiserver
  namespace: beast
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: beast
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: beast
    spec:
      serviceAccountName: beast
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: apiserver
          image: ghcr.io/walnuts1018/beast/backend:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: beast-config
            - secretRef:
                name: beast-runtime
          env:
            - name: AWS_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: beast-config
                  key: S3_ENDPOINT
                  optional: true
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: beast-config
                  key: S3_ENDPOINT
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
