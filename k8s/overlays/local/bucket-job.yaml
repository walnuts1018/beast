apiVersion: batch/v1
kind: Job
metadata:
  name: beast-create-bucket
  namespace: beast-data
  labels:
    app.kubernetes.io/name: bucket-init
    app.kubernetes.io/part-of: beast
spec:
  backoffLimit: 12
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bucket-init
        app.kubernetes.io/part-of: beast
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws
          image: amazon/aws-cli:2.29.0
          env:
            - name: AWS_ACCESS_KEY_ID
              value: beast
            - name: AWS_SECRET_ACCESS_KEY
              value: local-seaweedfs-password
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              until aws --endpoint-url http://seaweedfs:8333 s3api list-buckets >/dev/null 2>&1; do sleep 2; done;
              aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket beast || true
