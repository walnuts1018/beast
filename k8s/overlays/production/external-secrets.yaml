apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beast-runtime
  namespace: beast
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: beast-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: beast
        property: database_url
    - secretKey: POSTGRES_USER
      remoteRef:
        key: beast
        property: database_user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: beast
        property: database_password
    - secretKey: POSTGRES_DB
      remoteRef:
        key: beast
        property: database_name
    - secretKey: RABBITMQ_URL
      remoteRef:
        key: beast
        property: rabbitmq_url
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: beast
        property: s3_access_key_id
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: beast
        property: s3_secret_access_key
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: beast
        property: s3_access_key_id
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: beast
        property: s3_secret_access_key
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: beast
        property: s3_access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: beast
        property: s3_secret_access_key
    - secretKey: STAGING_ENCRYPTION_KEY
      remoteRef:
        key: beast
        property: staging_encryption_key
    - secretKey: MEDIA_ENCRYPTION_KEY
      remoteRef:
        key: beast
        property: media_encryption_key
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: beast
        property: oidc_client_id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: beast
        property: oidc_client_secret
