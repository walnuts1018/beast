apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: beast
  namespace: beast
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
  hostnames:
    - beast.walnuts.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: beast-frontend
          port: 8080
